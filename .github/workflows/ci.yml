name: CI

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    name: ${{ matrix.name }} Release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MinGW
            os: windows-latest
            c_compiler: gcc
            cxx_compiler: g++
          - name: Linux GCC
            os: ubuntu-latest
            c_compiler: gcc
            cxx_compiler: g++
          - name: macOS Clang
            os: macos-latest
            c_compiler: clang
            cxx_compiler: clang++

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up MSYS2 UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          libxrandr-dev
          libxinerama-dev
          libxcursor-dev
          libxi-dev
          libudev-dev
          libflac-dev
          libvorbis-dev
          libgl1-mesa-dev
          libegl1-mesa-dev
          libfreetype-dev
          libharfbuzz-dev
          libmbedtls-dev
          libssh2-1-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}

      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx_compiler }}

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build build --parallel

      - name: Build Unix
        if: runner.os != 'Windows'
        shell: bash
        run: cmake --build build --parallel

      - name: Validate required assets Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ctest --test-dir build --output-on-failure

      - name: Validate required assets Unix
        if: runner.os != 'Windows'
        shell: bash
        run: ctest --test-dir build --output-on-failure

  sanitizer-build:
    name: Linux ASan and UBSan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: >-
          sudo apt-get update &&
          sudo apt-get install -y
          ninja-build
          libxrandr-dev
          libxinerama-dev
          libxcursor-dev
          libxi-dev
          libudev-dev
          libgl1-mesa-dev

      - name: Configure sanitizers
        run: >-
          cmake -S . -B build-sanitized -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DENABLE_ADDRESS_SANITIZER=ON
          -DENABLE_UNDEFINED_SANITIZER=ON
          -DVOLTRON_ENABLE_IPO=OFF

      - name: Build sanitizers
        run: cmake --build build-sanitized --parallel

      - name: Validate required assets
        run: ctest --test-dir build-sanitized --output-on-failure
